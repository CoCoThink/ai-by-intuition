name: Build one PDF book

on:
  push:
    paths:
      - 'book/**/*.tex'
      - 'scripts/validate_book.py'
      - '.github/workflows/build-latex.yml'
  pull_request:
    paths:
      - 'book/**/*.tex'
      - 'scripts/validate_book.py'
      - '.github/workflows/build-latex.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-book:
    name: Compile AI by Intuition Volume 01
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaLaTeX, illustrations and Chinese fonts
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            latexmk texlive-luatex texlive-lang-chinese \
            texlive-latex-extra texlive-pictures texlive-fonts-recommended \
            fonts-noto-cjk fonts-noto-core lmodern poppler-utils
      - name: Check chapter structure before compilation
        run: python3 scripts/validate_book.py
      - name: Build one PDF
        working-directory: book
        run: |
          mkdir -p build
          latexmk -lualatex -interaction=nonstopmode -halt-on-error \
            -file-line-error -outdir=build main.tex
          cp build/main.pdf build/AI-by-Intuition-Volume-01.pdf
      - name: Verify rendered PDF table of contents
        run: python3 scripts/validate_book.py --pdf book/build/AI-by-Intuition-Volume-01.pdf
      - name: Publish single PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-by-intuition-volume-01
          path: book/build/AI-by-Intuition-Volume-01.pdf
          if-no-files-found: error

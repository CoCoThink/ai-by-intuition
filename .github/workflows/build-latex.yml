name: Build one PDF book

on:
  push:
    branches:
      - main
    paths:
      - 'book/**/*.tex'
      - 'scripts/**/*.py'
      - '.github/workflows/build-latex.yml'
  pull_request:
    paths:
      - 'book/**/*.tex'
      - 'scripts/**/*.py'
      - '.github/workflows/build-latex.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-book:
    name: Compile AI by Intuition Volume 01
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check chapter structure before compilation
        run: python3 scripts/validate_book.py
      - name: Build tagged PDF with TeX Live 2026
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq fonts-noto-cjk fonts-noto-core poppler-utils
            fc-cache -f
            mkdir -p pdfua-audit
            # TeX Live action runs as container root; restore runner ownership so
            # subsequent host-side audit steps can write in this directory.
            chown --reference=. pdfua-audit
            {
              echo 'TeX Live 2026, Debian (xu-cheng/texlive-action v3)'
              lualatex --version | head -n 1
              latexmk -v | head -n 2
              dpkg-query -W -f='${binary:Package}=${Version}\n' fonts-noto-cjk fonts-noto-core poppler-utils
              fc-match -f '%{family}: %{style}\n' 'Noto Serif CJK SC' | head -n 1
            } > pdfua-audit/texlive-environment.txt
            lualatex --version | head -1
            cd book
            mkdir -p build/smoke
            latexmk -lualatex -interaction=nonstopmode -halt-on-error \
              -file-line-error -outdir=build/smoke smoke-tagging.tex
            pdfinfo build/smoke/smoke-tagging.pdf | grep -Eq '^Tagged:[[:space:]]+yes'
            latexmk -lualatex -interaction=nonstopmode -halt-on-error \
              -file-line-error -outdir=build main.tex
            # Production must not regress to the earlier bad figure hierarchy or overflow.
            if grep -Eq 'Package tagpdf Warning: Parent-Child|Overfull \\hbox' build/main.log; then
              echo "::error::Invalid tagpdf parent-child relation or overfull box in book"
              grep -E 'Package tagpdf Warning: Parent-Child|Overfull \\hbox' build/main.log
              exit 1
            fi
            cp build/main.pdf build/AI-by-Intuition-Volume-01.pdf
            echo '=== Smoke tagged state ==='
            pdfinfo build/smoke/smoke-tagging.pdf | grep -E '^(Tagged|PDF version|Pages):'
            echo '=== Book tagged state in TeX Live 2026 container ==='
            pdfinfo build/AI-by-Intuition-Volume-01.pdf | grep -E '^(Tagged|PDF version|Pages):'
            echo '=== Book structure tree first lines ==='
            pdfinfo -struct build/AI-by-Intuition-Volume-01.pdf | head -n 12 || true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install PDF structure inspector
        run: python -m pip install --disable-pip-version-check pypdf==5.9.0
      - name: Record Python and host runtime
        run: |
          mkdir -p pdfua-audit
          {
            echo "runner_image=${ImageOS:-unknown}/${ImageVersion:-unknown}"
            python --version
            python -m pip show pypdf | grep -E '^(Name|Version):'
            pdftotext -v 2>&1 | head -n 1
          } > pdfua-audit/runner-environment.txt
      - name: Verify rendered PDF tags, structure and layout
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python3 scripts/validate_book.py --pdf book/build/AI-by-Intuition-Volume-01.pdf
      - name: Verify associated MathML for every displayed and inline Formula
        run: |
          mkdir -p pdfua-audit
          python3 scripts/validate_mathml_af.py \
            book/build/AI-by-Intuition-Volume-01.pdf \
            --minimum 1000 --json-output pdfua-audit/mathml-af-summary.json
      # Machine-verifiable PDF/UA-2 compliance is now mandatory for publication.
      # The release gate is intentionally limited to machine-verifiable rules.
      - name: Validate PDF/UA-2 with veraPDF
        timeout-minutes: 12
        run: |
          test -s book/build/AI-by-Intuition-Volume-01.pdf
          mkdir -p pdfua-audit
          # Digest observed in successful CI #39697175674 (veraPDF 1.30.2).
          VERAPDF_IMAGE="verapdf/cli@sha256:d5ee329657cf9bc4b2400392dd54c7d0a0ce9980ff6fa2da5590eebeec007cdb"
          docker pull "$VERAPDF_IMAGE"
          docker image inspect "$VERAPDF_IMAGE" \
            --format 'image_id={{.Id}} repo_digests={{json .RepoDigests}}' \
            > pdfua-audit/verapdf-image.txt
          docker run --rm --mount "type=bind,src=$PWD,dst=/data,readonly" \
            "$VERAPDF_IMAGE" \
            --flavour ua2 --format xml --maxfailuresdisplayed 5 \
            /data/book/build/AI-by-Intuition-Volume-01.pdf \
            > pdfua-audit/verapdf-pdfua2.xml
          python3 scripts/summarize_verapdf.py \
            pdfua-audit/verapdf-pdfua2.xml
      - name: Upload PDF/UA-2 machine audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfua2-machine-audit
          path: |
            pdfua-audit/verapdf-pdfua2.xml
            pdfua-audit/mathml-af-summary.json
            pdfua-audit/*.txt
          if-no-files-found: warn
      - name: Publish single PDF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-by-intuition-volume-01
          path: book/build/AI-by-Intuition-Volume-01.pdf
          if-no-files-found: error
      # Retain PDF and logs only when production validation fails.
      # Successful runs publish precisely one copy of the generated PDF.
      - name: Upload failed-build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-build-diagnostics
          path: |
            book/build/main.pdf
            book/build/main.log
            book/build/smoke/*.log
          if-no-files-found: warn
          retention-days: 7

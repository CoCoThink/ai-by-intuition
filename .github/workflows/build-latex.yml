name: Build LaTeX PDF

on:
  push:
    paths:
      - 'chapters/**/*.tex'
      - '.github/workflows/build-latex.yml'
  pull_request:
    paths:
      - 'chapters/**/*.tex'
      - '.github/workflows/build-latex.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-chapter-01:
    name: Build Chapter 01 (XeLaTeX)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and Chinese fonts
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y             latexmk texlive-xetex texlive-lang-chinese             texlive-latex-extra texlive-pictures texlive-fonts-recommended             fonts-noto-cjk fonts-noto-core lmodern
      - name: Compile with XeLaTeX
        working-directory: chapters/01-associative-memory
        run: |
          mkdir -p build
          latexmk -xelatex -interaction=nonstopmode -halt-on-error             -file-line-error -outdir=build main.tex
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: ai-by-intuition-chapter-01-pdf
          path: chapters/01-associative-memory/build/main.pdf
          if-no-files-found: error

name: Publish validated book

# Deliberately manual: a passing push build is NOT an instruction to publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New immutable release tag, e.g. v0.2.0'
        required: true
        type: string
      build_run_id:
        description: 'Successful main-branch Build one PDF book run ID'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify requested release and build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Version must be vMAJOR.MINOR.PATCH'
            exit 1
          fi
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo '::error::Build run ID must be numeric'
            exit 1
          fi
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1 || \
             gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo '::error::Tag or release already exists; never overwrite a published version'
            exit 1
          fi
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          jq -e --arg repo "$GH_REPO" '
            .name == "Build one PDF book" and
            (.event == "push" or .event == "workflow_dispatch") and
            .head_branch == "main" and
            .conclusion == "success" and
            .head_repository.full_name == $repo
          ' "$RUNNER_TEMP/source-run.json" >/dev/null
          validated_sha="$(jq -r '.head_sha' "$RUNNER_TEMP/source-run.json")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$validated_sha" origin/main || {
            echo '::error::Validated commit is not an ancestor of main'
            exit 1
          }
          # A successful build can precede documentation-only commits.
          # Reject any source or build-tool change made after that validated run.
          git diff --quiet "$validated_sha" origin/main -- book scripts .github/workflows/build-latex.yml || {
            echo '::error::Source or production validation changed after chosen PDF run'
            exit 1
          }
          echo "VALIDATED_SHA=$validated_sha" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_URL=$(jq -r '.html_url' "$RUNNER_TEMP/source-run.json")" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Download PDF from precisely the validated run
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ai-by-intuition-book
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Download audit from the same run
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: pdfua2-machine-audit
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/audit
      - name: Install pinned PDF reader for release provenance checks
        run: python -m pip install --disable-pip-version-check pypdf==5.9.0
      - name: Validate PDF and audit, assemble minimal assets
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from pypdf import PdfReader
          folder = Path("dist")
          pdf = folder / "AI-by-Intuition-Book.pdf"
          assert pdf.is_file() and pdf.stat().st_size > 1000000, "Missing validated PDF"
          actual_pages = len(PdfReader(str(pdf)).pages)
          summary = json.loads((folder / "audit/mathml-af-summary.json").read_text())
          assert actual_pages >= 50 and summary["pages"] == actual_pages, (
              f"Mismatch between PDF ({actual_pages}) and MathML audit: {summary}"
          )
          assert summary["formulas"] >= 1000 and summary["formulas"] == summary["associations"], summary
          root = ET.parse(folder / "audit/verapdf-pdfua2.xml").getroot()
          reports = [n for n in root.iter() if n.tag.rsplit("}", 1)[-1] == "validationReport"]
          assert len(reports) == 1 and reports[0].get("isCompliant") == "true", "PDF/UA-2 report not compliant"
          details = next(n for n in reports[0] if n.tag.rsplit("}", 1)[-1] == "details")
          assert details.get("failedRules") == "0" and details.get("failedChecks") == "0", details.attrib
          for name in ("texlive-environment.txt", "runner-environment.txt", "verapdf-image.txt"):
              assert (folder / "audit" / name).is_file(), f"Missing environment audit: {name}"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf8") as f:
              f.write(f"PDF_PAGE_COUNT={actual_pages}\\n")
              f.write(f"PDF_FORMULA_COUNT={summary['formulas']}\\n")
          print(f"Validated {actual_pages} pages, {summary['formulas']} MathML-AF associations, PDF/UA-2 and build evidence")
          PY
          (
            cd dist
            sha256sum AI-by-Intuition-Book.pdf > SHA256SUMS
            zip -q -j build-audit.zip audit/*
          )
      - name: Write release description
        run: |
          cat > dist/RELEASE-NOTES.md <<EOF
          # AI by Intuition · $RELEASE_VERSION

          中文教材 PDF 的版本化归档，源码提交：$VALIDATED_SHA。

          来源：$SOURCE_RUN_URL
          验收：$PDF_PAGE_COUNT 页 Tagged PDF、$PDF_FORMULA_COUNT/$PDF_FORMULA_COUNT MathML-AF 关联、veraPDF PDF/UA-2 零失败，以及源文件、数值与版面检查。

          下载：PDF 正式文件、SHA256SUMS 文件校验和、build-audit.zip（机器报告及构建环境）。历史版本不覆盖或重编译替换。
          机器合规不代表在所有辅助阅读器中的实际体验。本项目原创教材与正式 PDF 采用 CC BY 4.0（https://creativecommons.org/licenses/by/4.0/），建议署名 AI by Intuition · CoCoThink and contributors（https://github.com/CoCoThink/ai-by-intuition）；scripts/ Python 工具及 .github/workflows/ 采用 MIT。第三方引用按其自身权利/许可处理。
          EOF
      - name: Create immutable versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_VERSION" \
            dist/AI-by-Intuition-Book.pdf \
            dist/SHA256SUMS \
            dist/build-audit.zip \
            --target "$VALIDATED_SHA" \
            --title "AI by Intuition · $RELEASE_VERSION" \
            --notes-file dist/RELEASE-NOTES.md \
            --latest

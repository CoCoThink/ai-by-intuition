name: Check Markdown links

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'LICENSE'
      - 'scripts/LICENSE'
      - 'scripts/check_markdown_links.py'
      - '.github/workflows/**/*.yml'
      - 'scripts/check_workflows.py'
  pull_request:
    paths:
      - '**/*.md'
      - 'LICENSE'
      - 'scripts/LICENSE'
      - 'scripts/check_markdown_links.py'
      - '.github/workflows/**/*.yml'
      - 'scripts/check_workflows.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify dual-license files and scope
        run: |
          test -s LICENSE
          test -s scripts/LICENSE
          grep -q 'Creative Commons Attribution 4.0 International' LICENSE
          grep -q 'MIT License' scripts/LICENSE
          grep -q 'Copyright (c) 2026 CoCoThink and contributors' scripts/LICENSE
          grep -q 'CC BY 4.0' README.md
          grep -q 'scripts/LICENSE' README.md
      - name: Validate local Markdown link targets
        run: python3 scripts/check_markdown_links.py
      - name: Install workflow YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate workflow syntax and release safety invariants
        run: python3 scripts/check_workflows.py

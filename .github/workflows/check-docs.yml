name: Check Markdown links

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'scripts/check_markdown_links.py'
      - '.github/workflows/**/*.yml'
      - 'scripts/check_workflows.py'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/check_markdown_links.py'
      - '.github/workflows/**/*.yml'
      - 'scripts/check_workflows.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate local Markdown link targets
        run: python3 scripts/check_markdown_links.py
      - name: Install workflow YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate workflow syntax and release safety invariants
        run: python3 scripts/check_workflows.py
